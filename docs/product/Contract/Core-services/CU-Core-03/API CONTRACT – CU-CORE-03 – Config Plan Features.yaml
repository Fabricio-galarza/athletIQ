openapi: 3.0.3
info:
  title: Plans Features API
  version: 1.0.0
  description: API para configuración de features en planes

paths:
  /api/v1/plans/{id}/features/:
    put:
      summary: Configurar features de un plan
      description: |
        Configura las features habilitadas para un plan.
        Permite activar o desactivar funcionalidades específicas,
        respetando la relación con los módulos habilitados.
      tags:
        - Plan Features
      security:
        - BearerAuth: []

      parameters:
        - in: path
          name: id
          required: true
          description: Identificador del plan
          schema:
            type: string
            format: uuid

      requestBody:
        required: true
        content:
          application/json:
            schema:
              type: array
              minItems: 1
              items:
                $ref: '#/components/schemas/PlanFeatureUpdateItem'
            examples:
              example:
                value:
                  - feature_id: "uuid-feature-1"
                    is_enabled: true
                  - feature_id: "uuid-feature-2"
                    is_enabled: false

      responses:
        '200':
          description: Features actualizadas correctamente
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/SuccessMessage'
              examples:
                success:
                  value:
                    message: "Features updated successfully"

        '400':
          description: Error de validación
          content:
            application/json:
              schema:
                oneOf:
                  - $ref: '#/components/schemas/ErrorInvalidData'
                  - $ref: '#/components/schemas/ErrorModuleNotEnabled'
                  - $ref: '#/components/schemas/ErrorDuplicateFeature'
              examples:
                invalid_data:
                  value:
                    error: "INVALID_DATA"
                module_disabled:
                  value:
                    error: "MODULE_NOT_ENABLED_FOR_PLAN"
                duplicate:
                  value:
                    error: "DUPLICATE_FEATURE_IN_REQUEST"

        '401':
          description: No autenticado
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/Error401'
              examples:
                unauthorized:
                  value:
                    detail: "Authentication credentials were not provided."

        '403':
          description: Acceso prohibido
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/Error403'
              examples:
                forbidden:
                  value:
                    error: "FORBIDDEN"

        '404':
          description: Recurso no encontrado
          content:
            application/json:
              schema:
                oneOf:
                  - $ref: '#/components/schemas/ErrorPlanNotFound'
                  - $ref: '#/components/schemas/ErrorFeatureNotFound'
              examples:
                plan_not_found:
                  value:
                    error: "PLAN_NOT_FOUND"
                feature_not_found:
                  value:
                    error: "FEATURE_NOT_FOUND"

components:
  securitySchemes:
    BearerAuth:
      type: http
      scheme: bearer
      bearerFormat: JWT

  schemas:
    PlanFeatureUpdateItem:
      type: object
      properties:
        feature_id:
          type: string
          format: uuid
          description: Identificador de la feature
        is_enabled:
          type: boolean
          description: Activa o desactiva la feature
      required:
        - feature_id
        - is_enabled

    SuccessMessage:
      type: object
      properties:
        message:
          type: string

    Error401:
      type: object
      properties:
        detail:
          type: string

    Error403:
      type: object
      properties:
        error:
          type: string

    ErrorPlanNotFound:
      type: object
      properties:
        error:
          type: string
          example: PLAN_NOT_FOUND

    ErrorFeatureNotFound:
      type: object
      properties:
        error:
          type: string
          example: FEATURE_NOT_FOUND

    ErrorModuleNotEnabled:
      type: object
      properties:
        error:
          type: string
          example: MODULE_NOT_ENABLED_FOR_PLAN

    ErrorInvalidData:
      type: object
      properties:
        error:
          type: string
          example: INVALID_DATA

    ErrorDuplicateFeature:
      type: object
      properties:
        error:
          type: string
          example: DUPLICATE_FEATURE_IN_REQUEST