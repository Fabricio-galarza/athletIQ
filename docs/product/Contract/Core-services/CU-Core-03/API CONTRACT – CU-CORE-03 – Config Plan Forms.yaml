openapi: 3.0.3
info:
  title: Plans Forms API
  version: 1.0.0
  description: API para configuración de formularios en planes

paths:
  /api/v1/plans/{id}/forms/:
    put:
      summary: Configurar formularios de un plan
      description: |
        Configura los formularios habilitados para un plan.
        Permite definir qué formularios pueden utilizar los usuarios
        según su plan, respetando la dependencia con los módulos habilitados.
      tags:
        - Plan Forms
      security:
        - BearerAuth: []

      parameters:
        - in: path
          name: id
          required: true
          description: Identificador del plan
          schema:
            type: string
            format: uuid

      requestBody:
        required: true
        content:
          application/json:
            schema:
              type: array
              minItems: 1
              items:
                $ref: '#/components/schemas/PlanFormUpdateItem'
            examples:
              example:
                value:
                  - form_id: "uuid-form-1"
                    is_enabled: true
                  - form_id: "uuid-form-2"
                    is_enabled: false

      responses:
        '200':
          description: Formularios actualizados correctamente
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/SuccessMessage'
              examples:
                success:
                  value:
                    message: "Forms updated successfully"

        '400':
          description: Error de validación
          content:
            application/json:
              schema:
                oneOf:
                  - $ref: '#/components/schemas/ErrorInvalidData'
                  - $ref: '#/components/schemas/ErrorModuleNotEnabled'
                  - $ref: '#/components/schemas/ErrorDuplicateForm'
              examples:
                invalid_data:
                  value:
                    error: "INVALID_DATA"
                module_disabled:
                  value:
                    error: "MODULE_NOT_ENABLED_FOR_PLAN"
                duplicate:
                  value:
                    error: "DUPLICATE_FORM_IN_REQUEST"

        '401':
          description: No autenticado
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/Error401'
              examples:
                unauthorized:
                  value:
                    detail: "Authentication credentials were not provided."

        '403':
          description: Acceso prohibido
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/Error403'
              examples:
                forbidden:
                  value:
                    error: "FORBIDDEN"

        '404':
          description: Recurso no encontrado
          content:
            application/json:
              schema:
                oneOf:
                  - $ref: '#/components/schemas/ErrorPlanNotFound'
                  - $ref: '#/components/schemas/ErrorFormNotFound'
              examples:
                plan_not_found:
                  value:
                    error: "PLAN_NOT_FOUND"
                form_not_found:
                  value:
                    error: "FORM_NOT_FOUND"

components:
  securitySchemes:
    BearerAuth:
      type: http
      scheme: bearer
      bearerFormat: JWT

  schemas:
    PlanFormUpdateItem:
      type: object
      properties:
        form_id:
          type: string
          format: uuid
          description: Identificador del formulario
        is_enabled:
          type: boolean
          description: Activa o desactiva el formulario
      required:
        - form_id
        - is_enabled

    SuccessMessage:
      type: object
      properties:
        message:
          type: string

    Error401:
      type: object
      properties:
        detail:
          type: string

    Error403:
      type: object
      properties:
        error:
          type: string

    ErrorPlanNotFound:
      type: object
      properties:
        error:
          type: string
          example: PLAN_NOT_FOUND

    ErrorFormNotFound:
      type: object
      properties:
        error:
          type: string
          example: FORM_NOT_FOUND

    ErrorModuleNotEnabled:
      type: object
      properties:
        error:
          type: string
          example: MODULE_NOT_ENABLED_FOR_PLAN

    ErrorInvalidData:
      type: object
      properties:
        error:
          type: string
          example: INVALID_DATA

    ErrorDuplicateForm:
      type: object
      properties:
        error:
          type: string
          example: DUPLICATE_FORM_IN_REQUEST