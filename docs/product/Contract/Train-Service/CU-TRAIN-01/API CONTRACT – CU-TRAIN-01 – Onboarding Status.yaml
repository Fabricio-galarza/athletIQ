# API CONTRACT – CU-TRAIN-01 – Onboarding Status.yaml

openapi: 3.0.3
info:
  title: Onboarding API
  version: 1.0.0
  description: API para onboarding completo (evaluación + generación de test)

paths:
  /api/v1/onboarding/status:
    get:
      summary: Get onboarding status
      description: |
        Complete onboarding endpoint that:
        1. Evaluates data sufficiency (HU-05)
        2. If insufficient data, automatically creates a test workout (HU-06)
        3. Creates training_session and training_session_block records
      tags:
        - Onboarding
      security:
        - BearerAuth: []
        - UserContext: []

      parameters:
        - in: query
          name: sport_id
          required: true
          schema:
            type: string
          description: Sport name (e.g., Running)
          example: "running"

      responses:
        '200':
          description: Onboarding status retrieved
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/OnboardingResponse'
              examples:
                with_test:
                  value:
                    has_sufficient_data: false
                    missing_required_fields: ["experience_years", "weekly_frequency", "primary_goal", "gender", "age_range"]
                    completion_score: 0
                    requires_test: true
                    total_required_fields: 5
                    completed_required_fields: 0
                    test_created: true
                    test_session:
                      session_id: "4e192692-ee30-4eb8-9dfd-0f8dc0dcceb2"
                      status: "planned"
                      source: "test"
                      planned_duration_minutes: 30
                      template_used: "running_intermediate_26_35"
                      blocks:
                        - block_order: 1
                          block_type: "warmup"
                          duration_minutes: 10
                          intensity: "easy"
                          instructions: "Trote suave + ejercicios de movilidad"
                        - block_order: 2
                          block_type: "main"
                          duration_minutes: 20
                          intensity: "hard"
                          instructions: "Corre 5K a ritmo constante. Registra tu tiempo final."
                        - block_order: 3
                          block_type: "cooldown"
                          duration_minutes: 5
                          intensity: "easy"
                          instructions: "Estiramientos"
                    next_step: "complete_test"
                without_test:
                  value:
                    has_sufficient_data: true
                    missing_required_fields: []
                    completion_score: 100
                    requires_test: false
                    total_required_fields: 5
                    completed_required_fields: 5
                    test_created: false
                    test_session: null
                    next_step: "ready_for_plan"

        '400':
          description: Bad request
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/Error400'
              example:
                detail: "sport_id query parameter is required"

        '401':
          description: Unauthorized
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/Error401'

        '403':
          description: Forbidden
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/Error403'

        '404':
          description: No template found
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/Error404'
              example:
                detail: "No test template found for the athlete's profile"

components:
  securitySchemes:
    BearerAuth:
      type: http
      scheme: bearer
      bearerFormat: JWT
    UserContext:
      type: apiKey
      in: header
      name: X-User-Context

  schemas:
    OnboardingResponse:
      type: object
      properties:
        has_sufficient_data:
          type: boolean
        missing_required_fields:
          type: array
          items:
            type: string
        completion_score:
          type: integer
        requires_test:
          type: boolean
        total_required_fields:
          type: integer
        completed_required_fields:
          type: integer
        test_created:
          type: boolean
        test_session:
          type: object
          nullable: true
          properties:
            session_id:
              type: string
              format: uuid
            status:
              type: string
            source:
              type: string
            planned_duration_minutes:
              type: integer
            template_used:
              type: string
            blocks:
              type: array
              items:
                type: object
                properties:
                  block_order:
                    type: integer
                  block_type:
                    type: string
                  duration_minutes:
                    type: integer
                  intensity:
                    type: string
                  instructions:
                    type: string
        next_step:
          type: string
          enum:
            - complete_test
            - ready_for_plan

    Error400:
      type: object
      properties:
        detail:
          type: string

    Error401:
      type: object
      properties:
        detail:
          type: string

    Error403:
      type: object
      properties:
        error:
          type: string
        detail:
          type: string

    Error404:
      type: object
      properties:
        detail:
          type: string